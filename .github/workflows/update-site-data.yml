name: Monthly rebuild

on:
  schedule:
    # Runs at 02:00 UTC on the 1st of every month
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rebuild:
    name: Trigger deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy workflow
        run: |
          gh workflow run deploy.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
